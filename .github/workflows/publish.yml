name: Publish Packages

# Publishes the anonymizer bindings to npm (WASM) and PyPI (PyO3/maturin).
# Free on this public repo. Triggers when a GitHub Release is published, or
# manually via workflow_dispatch (use this to publish for an already-cut tag).
#
# Required repo secrets:
#   NPM_TOKEN   — npm automation token with publish rights to @sovereign-cognitive-identity
#   PYPI_TOKEN  — PyPI API token (project- or account-scoped) for the sci-anonymizer project

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  WASM_DIR: core/crates/sci-anonymizer-wasm
  PY_DIR: core/crates/sci-anonymizer-py

jobs:
  npm:
    name: Publish npm (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Verify wasm-pack on PATH
        run: wasm-pack --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build WASM package
        working-directory: ${{ env.WASM_DIR }}
        run: wasm-pack build --target bundler --release --no-opt

      - name: Publish to npm
        working-directory: ${{ env.WASM_DIR }}
        # --access public is required for the first publish of a scoped package.
        # --ignore-scripts: pkg/ is already built above; don't re-run lifecycle build.
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-build:
    name: Build wheels (${{ matrix.platform.os }} ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    # Scarce public macOS-Intel runners have wedged this run for >1h before;
    # fail fast so a stuck runner doesn't hold the whole publish hostage.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  os: linux,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  os: linux,  target: aarch64, manylinux: auto }
          - { runner: macos-13,       os: macos,  target: x86_64 }
          - { runner: macos-14,       os: macos,  target: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PY_DIR }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: ${{ env.PY_DIR }}/dist

  pypi-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PY_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: ${{ env.PY_DIR }}/dist

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [pypi-build, pypi-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          # --skip-existing makes re-runs idempotent.
          args: --non-interactive --skip-existing dist/*
