name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sci (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            bun_target: bun-darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-13
            bun_target: bun-darwin-x64
            continue_on_error: true
          - target: aarch64-linux
            runner: ubuntu-latest
            bun_target: bun-linux-arm64
          - target: x86_64-linux
            runner: ubuntu-latest
            bun_target: bun-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js (for native addon compilation)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Build proxy (needed by agent compile)
        run: npm run build -w packages/telemetry && npm run build -w packages/proxy

      - name: Build MCP server (SCI-252)
        run: npm run build -w packages/mcp

      - name: Compile sci binary
        run: |
          bun build packages/agent/dist/index.js \
            --compile \
            --target ${{ matrix.bun_target }} \
            --outfile sci \
            --external hnswlib-node \
            --external better-sqlite3 \
            --external fastembed \
            --external @anush008/tokenizers

      - name: Install native addons
        run: |
          mkdir -p native_addons
          npm install --prefix native_addons \
            hnswlib-node better-sqlite3 fastembed \
            --no-save --no-audit --no-fund

      - name: Package release tarball
        run: |
          # Tarball extracts to sci/ — intended install layout is ~/.sci/bin/:
          #   ~/.sci/bin/sci              ← Bun-compiled agent binary
          #   ~/.sci/bin/node_modules/    ← native addons (hnswlib-node, better-sqlite3, etc.)
          #   ~/.sci/bin/mcp/             ← compiled MCP server JS (memory_recall, memory_store, etc.)
          # The binary uses createRequire relative to process.execPath, so node_modules must
          # stay alongside the binary. install.sh targets ~/.sci/bin/ for this reason (SCI-213).
          ARCHIVE="sci-${{ matrix.target }}.tar.gz"
          mkdir -p release/sci
          cp sci release/sci/sci
          cp -r native_addons/node_modules release/sci/node_modules
          cp -r packages/mcp/dist release/sci/mcp
          chmod +x release/sci/sci
          tar -czf "${ARCHIVE}" -C release sci
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sci-${{ matrix.target }}
          path: |
            sci-${{ matrix.target }}.tar.gz
            sci-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Sci ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/sci-aarch64-apple-darwin.tar.gz
            dist/sci-aarch64-apple-darwin.tar.gz.sha256
            dist/sci-aarch64-linux.tar.gz
            dist/sci-aarch64-linux.tar.gz.sha256
            dist/sci-x86_64-linux.tar.gz
            dist/sci-x86_64-linux.tar.gz.sha256
          fail_on_unmatched_files: false
