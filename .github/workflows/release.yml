name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sci-helper (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('apps/sci-mac/SciHelper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: |
          cargo build --release \
            --manifest-path apps/sci-mac/SciHelper/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Rename binary and compute checksum
        run: |
          BINARY_SRC="apps/sci-mac/SciHelper/target/${{ matrix.target }}/release/sci-helper"
          BINARY_DST="sci-helper-${{ matrix.target }}"
          cp "${BINARY_SRC}" "${BINARY_DST}"
          shasum -a 256 "${BINARY_DST}" > "${BINARY_DST}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sci-helper-${{ matrix.target }}
          path: |
            sci-helper-${{ matrix.target }}
            sci-helper-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist contents
        run: ls -lh dist/

      - name: Determine release body
        id: body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "body_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Sci ${{ github.ref_name }}"
          body_path: ${{ steps.body.outputs.body_path != '' && steps.body.outputs.body_path || '' }}
          generate_release_notes: ${{ steps.body.outputs.body_path == '' }}
          files: |
            dist/sci-helper-aarch64-apple-darwin
            dist/sci-helper-aarch64-apple-darwin.sha256
            dist/sci-helper-x86_64-apple-darwin
            dist/sci-helper-x86_64-apple-darwin.sha256
          fail_on_unmatched_files: true
