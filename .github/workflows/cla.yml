name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla_assistant:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read and agree to the Sci Contributor License Agreement.') ||
       github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/sovereign-cognitive-identity/sci/blob/main/CLA.md'
          branch: 'main'
          allowlist: sovereign-cognitive-identity-bot
          signed-commit-message: |
            $contributorName has signed the CLA in #$pullRequestNo
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this pull request, please sign the Contributor License Agreement by adding the following comment:

            > **I have read and agree to the Sci Contributor License Agreement.**

            [Read the CLA](https://github.com/sovereign-cognitive-identity/sci/blob/main/CLA.md) — it's short and explains why it exists.
          custom-pr-sign-comment: 'I have read and agree to the Sci Contributor License Agreement.'
