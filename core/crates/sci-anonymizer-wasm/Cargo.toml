[package]
name         = "sci-anonymizer-wasm"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = "Apache-2.0 OR MIT"
description  = "WASM + npm bindings for sci-anonymizer. Published as @sovereign-cognitive-identity/anonymizer."

[lib]
crate-type = ["cdylib"]

[dependencies]
sci-anonymizer    = { path = "../sci-anonymizer" }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
serde-wasm-bindgen = "0.4"
wasm-bindgen      = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
