[package]
name         = "sci-anonymizer"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
# Permissively licensed (overrides the workspace BUSL-1.1): this crate is the
# embeddable wedge, meant to be vendored into other tools. See LICENSE-APACHE
# and LICENSE-MIT.
license      = "Apache-2.0 OR MIT"
description  = "Reversible entity anonymization + token mapping for LLM round-trips. Mirrors @sci/core's anonymizer."

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
once_cell     = { workspace = true }
regex         = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
# Parity tests load JSON fixtures captured from the TypeScript reference.
# When we eventually drop the TS implementation, these fixtures stay as
# the ground-truth contract for the algorithm.
serde_json    = { workspace = true }
indoc         = "2"
