---
# Sci control plane — VPS deployment playbook
#
# Usage (first time):
#   cp deploy/ansible/vars.yml.example deploy/ansible/vars.yml
#   # fill in vars.yml
#   ansible-playbook -i deploy/ansible/inventory.yml deploy/ansible/playbook.yml
#
# Re-deploy after code changes (skips system setup, just pulls + restarts):
#   ansible-playbook -i deploy/ansible/inventory.yml deploy/ansible/playbook.yml \
#     --tags deploy
#
# Requirements on controller (your Mac):
#   pip install ansible
#   ~/.sci/ca.crt + ca.key must exist (run `sci up` once to generate them)

- name: Deploy Sci control plane
  hosts: sci_control
  become: true
  vars_files:
    - vars.yml

  tasks:

    # ── System setup ──────────────────────────────────────────────────────────
    - name: Install system packages
      tags: [system]
      apt:
        name: [ca-certificates, curl, gnupg, git, ufw]
        state: present
        update_cache: true

    - name: Add Docker GPG key
      tags: [system, docker]
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      tags: [system, docker]
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      tags: [system, docker]
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      tags: [system, docker]
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Configure firewall
      tags: [system, firewall]
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Enable firewall
      tags: [system, firewall]
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ── Deploy ────────────────────────────────────────────────────────────────
    - name: Remove stale git lock if present
      tags: [deploy]
      file:
        path: "{{ sci_repo_dir }}/.git/index.lock"
        state: absent

    - name: Clone or update repo
      tags: [deploy]
      git:
        repo: "{{ sci_repo_url }}"
        dest: "{{ sci_repo_dir }}"
        version: main
        force: true
        update: true
      become_user: "{{ ansible_user }}"

    - name: Force pull latest from origin
      tags: [deploy]
      shell: |
        git fetch origin && git reset --hard origin/main
      args:
        chdir: "{{ sci_repo_dir }}"

    - name: Ensure deploy dir exists
      tags: [deploy]
      file:
        path: "{{ sci_repo_dir }}/deploy"
        state: directory
        mode: "0755"

    - name: Write .env.prod
      tags: [deploy]
      copy:
        dest: "{{ sci_repo_dir }}/deploy/.env.prod"
        mode: "0600"
        content: |
          POSTGRES_ADMIN_PASSWORD={{ postgres_admin_password }}
          SCI_INTERNAL_TOKEN={{ sci_internal_token }}

    - name: Build and start containers
      tags: [deploy]
      shell: |
        docker compose \
          -f {{ sci_repo_dir }}/deploy/docker-compose.prod.yml \
          --env-file {{ sci_repo_dir }}/deploy/.env.prod \
          up -d --build
      args:
        chdir: "{{ sci_repo_dir }}"

    # ── Nginx + TLS ───────────────────────────────────────────────────────────
    - name: Install certbot
      tags: [deploy, tls]
      apt:
        name: [certbot, python3-certbot-nginx]
        state: present
        update_cache: true

    - name: Write nginx site config for control.threadline.fashion
      tags: [deploy, tls]
      copy:
        dest: /etc/nginx/sites-available/sci-control
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name control.threadline.fashion;
              location / {
                  proxy_pass http://127.0.0.1:3003;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      register: nginx_config

    - name: Enable nginx site
      tags: [deploy, tls]
      file:
        src: /etc/nginx/sites-available/sci-control
        dest: /etc/nginx/sites-enabled/sci-control
        state: link

    - name: Reload nginx
      tags: [deploy, tls]
      systemd:
        name: nginx
        state: reloaded

    - name: Obtain Let's Encrypt certificate
      tags: [deploy, tls]
      shell: |
        certbot --nginx -d control.threadline.fashion \
          --non-interactive --agree-tos -m casey.zandbergen@gmail.com \
          --redirect 2>&1
      register: certbot_result
      changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
      failed_when: certbot_result.rc != 0 and 'Certificate not yet due for renewal' not in certbot_result.stdout

    # ── CA bootstrap ──────────────────────────────────────────────────────────
    # The control plane serves the CA to enrolling devices but doesn't generate
    # it. Copy from the controller's ~/.sci/ into the running container's volume
    # (one-time; skipped if ca.crt already exists inside the container).
    - name: Check if CA exists in container
      tags: [deploy, ca]
      shell: |
        docker compose \
          -f {{ sci_repo_dir }}/deploy/docker-compose.prod.yml \
          exec -T sci-control test -f /home/sci/.sci/ca.crt && echo yes || echo no
      args:
        chdir: "{{ sci_repo_dir }}"
      register: ca_check
      changed_when: false

    - name: Upload CA files to VPS staging directory
      tags: [deploy, ca]
      when: ca_check.stdout | trim == "no"
      copy:
        src: "{{ lookup('env', 'HOME') }}/.sci/{{ item }}"
        dest: "/tmp/sci-{{ item }}"
        mode: "0600"
      loop: [ca.crt, ca.key]

    - name: Copy CA files from VPS into container
      tags: [deploy, ca]
      when: ca_check.stdout | trim == "no"
      shell: |
        docker cp /tmp/sci-{{ item.src }} \
          $(docker ps --filter name=sci-control --format '{{ "{{" }}.ID{{ "}}" }}' | head -1):{{ item.dest }}
      loop:
        - { src: ca.crt, dest: /home/sci/.sci/ca.crt }
        - { src: ca.key, dest: /home/sci/.sci/ca.key }

    - name: Fix CA file ownership inside container
      tags: [deploy, ca]
      when: ca_check.stdout | trim == "no"
      shell: |
        docker exec --user root \
          $(docker ps --filter name=sci-control --format '{{ "{{" }}.ID{{ "}}" }}' | head -1) \
          chown sci:sci /home/sci/.sci/ca.crt /home/sci/.sci/ca.key

    - name: Restart sci-control after CA copy
      tags: [deploy, ca]
      when: ca_check.stdout | trim == "no"
      shell: |
        docker compose \
          -f {{ sci_repo_dir }}/deploy/docker-compose.prod.yml \
          restart sci-control
      args:
        chdir: "{{ sci_repo_dir }}"

    # ── First-run init ────────────────────────────────────────────────────────
    # Creates the owner account. Idempotent — the control plane returns 409 if
    # already initialized, which we treat as success.
    - name: Wait for control plane to be ready
      tags: [deploy, init]
      uri:
        url: https://control.threadline.fashion/api/setup/status
        method: GET
        status_code: [200]
        validate_certs: true
      register: setup_status
      until: setup_status.status == 200
      retries: 12
      delay: 5

    - name: Bootstrap admin account
      tags: [deploy, init]
      uri:
        url: https://control.threadline.fashion/api/setup/init
        method: POST
        body_format: json
        body:
          email: "{{ sci_admin_email }}"
          password: "{{ sci_admin_password }}"
          displayName: "{{ sci_admin_display_name }}"
        status_code: [201, 409]   # 409 = already initialized, treat as ok
      register: init_result

    - name: Report init result
      tags: [deploy, init]
      debug:
        msg: >-
          {{
            'Already initialized — skipped.'
            if init_result.status == 409
            else 'Admin account created: ' + sci_admin_email
          }}
