# Sci control plane — production VPS deployment
#
# Usage:
#   cp deploy/.env.prod.example deploy/.env.prod
#   # fill in secrets in .env.prod
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#
# First-time bootstrap after containers are up:
#   curl -X POST https://control.threadline.fashion/api/setup/init \
#     -H 'Content-Type: application/json' \
#     -d '{"email":"your@email.com","password":"strong-password"}'
#
# CA bootstrap (one-time — see .env.prod.example for details):
#   docker compose -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod \
#     exec sci-control sh -c 'ls /home/sci/.sci/'

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - sci-control

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:       sci
      POSTGRES_USER:     sci_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - sci_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U sci_admin -d sci"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped

  sci-control:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCI_DB_READER_URL:  postgresql://sci_reader:sci_reader_local@postgres:5432/sci
      SCI_DB_WRITER_URL:  postgresql://sci_writer:sci_writer_local@postgres:5432/sci
      SCI_CONTROL_PORT:   "3003"
      SCI_COOKIE_SECURE:  "true"
      SCI_CA_CERT_PATH:   /home/sci/.sci/ca.crt
      SCI_CA_KEY_PATH:    /home/sci/.sci/ca.key
      SCI_INTERNAL_TOKEN: ${SCI_INTERNAL_TOKEN}
    volumes:
      - sci_config:/home/sci/.sci
    command: ["node", "packages/control/dist/index.js"]
    restart: unless-stopped

volumes:
  sci_data:
  sci_config:
  caddy_data:
  caddy_config:
